<p>navigation works!</p>

<header class="navbar">
  <div class="nav-container">

    <!-- Logo -->
    <a routerLink="/" class="logo" (click)="closeMenu()">
      <span class="logo-icon">🌿</span>
      <span>Eco<span class="logo-green">Clean</span></span>
    </a>

    <!-- Navigation Links -->
    <nav class="nav-links" [class.open]="menuOpen">

      <a routerLink="/"
         routerLinkActive="active"
         [routerLinkActiveOptions]="{ exact: true }"
         (click)="closeMenu()">
        Home
      </a>

      <a routerLink="/about"
         routerLinkActive="active"
         (click)="closeMenu()">
        About
      </a>

      <a routerLink="/services"
         routerLinkActive="active"
         (click)="closeMenu()">
        Services
      </a>

      <a routerLink="/contact"
         routerLinkActive="active"
         (click)="closeMenu()">
        Contact
      </a>

      <div class="mobile-actions">
        <a routerLink="/login" (click)="closeMenu()">Login</a>
        <a routerLink="/register"
           class="mobile-register"
           (click)="closeMenu()">
          Get Started
        </a>
      </div>

    </nav>

    <!-- Desktop Actions -->
    <div class="nav-actions">
      <a routerLink="/login" class="login-link">Login</a>

      <a routerLink="/register" class="register-btn">
        Get Started <span>→</span>
      </a>
    </div>

    <!-- Mobile Menu Button -->
    <button
      class="menu-toggle"
      type="button"
      (click)="toggleMenu()"
      [attr.aria-expanded]="menuOpen"
      aria-label="Toggle navigation menu">
      {{ menuOpen ? '✕' : '☰' }}
    </button>

  </div>
</header>
